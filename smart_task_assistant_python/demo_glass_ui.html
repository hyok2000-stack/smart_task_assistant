<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能任务助手 - 现代简约风格DEMO</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
            overflow-x: hidden;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .floating-shapes {
            position: fixed;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 0;
        }

        .shape {
            position: absolute;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            animation: float 20s infinite;
        }

        .shape:nth-child(1) {
            width: 300px;
            height: 300px;
            top: 10%;
            left: 10%;
            animation-delay: 0s;
        }

        .shape:nth-child(2) {
            width: 200px;
            height: 200px;
            top: 60%;
            right: 10%;
            animation-delay: 2s;
        }

        .shape:nth-child(3) {
            width: 150px;
            height: 150px;
            bottom: 20%;
            left: 30%;
            animation-delay: 4s;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); opacity: 0.5; }
            50% { transform: translateY(-30px) rotate(180deg); opacity: 0.8; }
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            padding: 40px;
            margin-bottom: 30px;
            transition: all 0.3s ease;
        }

        .glass-card:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-5px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.15);
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            color: white;
            font-size: 3em;
            font-weight: 300;
            margin-bottom: 10px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
        }

        .header p {
            color: rgba(255, 255, 255, 0.9);
            font-size: 1.1em;
            font-weight: 300;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 25px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
        }

        .stat-card:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: scale(1.02);
        }

        .stat-icon {
            width: 50px;
            height: 50px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            margin-bottom: 15px;
        }

        .stat-value {
            color: white;
            font-size: 2.5em;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .stat-label {
            color: rgba(255, 255, 255, 0.8);
            font-size: 0.9em;
            font-weight: 300;
        }

        .task-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }

        @media (max-width: 968px) {
            .task-section {
                grid-template-columns: 1fr;
            }
        }

        .task-list {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 25px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .section-title {
            color: white;
            font-size: 1.3em;
            font-weight: 500;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .task-item {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 18px;
            margin-bottom: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .task-item:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.3);
            transform: translateX(5px);
        }

        .task-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .task-title {
            color: white;
            font-size: 1em;
            font-weight: 500;
        }

        .task-priority {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75em;
            font-weight: 500;
        }

        .priority-high {
            background: rgba(255, 107, 107, 0.3);
            color: #fff;
        }

        .priority-medium {
            background: rgba(255, 193, 7, 0.3);
            color: #fff;
        }

        .priority-low {
            background: rgba(76, 175, 80, 0.3);
            color: #fff;
        }

        .task-meta {
            display: flex;
            gap: 15px;
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.85em;
        }

        .task-meta span {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .quick-actions {
            display: flex;
            gap: 15px;
            margin-top: 20px;
        }

        .action-btn {
            flex: 1;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 12px;
            padding: 15px 20px;
            color: white;
            font-size: 0.95em;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .action-btn:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);
        }

        .action-btn.primary {
            background: rgba(255, 255, 255, 0.95);
            color: #667eea;
        }

        .action-btn.primary:hover {
            background: white;
        }

        .search-bar {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 8px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .search-icon {
            padding: 0 15px;
            font-size: 1.2em;
            color: rgba(255, 255, 255, 0.7);
        }

        .search-input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: white;
            font-size: 1em;
            padding: 10px 0;
        }

        .search-input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .filter-tags {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .filter-tag {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 6px 16px;
            color: rgba(255, 255, 255, 0.8);
            font-size: 0.85em;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .filter-tag:hover,
        .filter-tag.active {
            background: rgba(255, 255, 255, 0.25);
            color: white;
            border-color: rgba(255, 255, 255, 0.4);
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            margin-top: 10px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, rgba(255, 255, 255, 0.6), rgba(255, 255, 255, 0.9));
            border-radius: 3px;
            transition: width 0.5s ease;
        }

        .nav-bar {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 50px;
            padding: 10px 30px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            display: flex;
            gap: 20px;
            z-index: 100;
        }

        .nav-item {
            background: transparent;
            border: none;
            color: rgba(255, 255, 255, 0.7);
            font-size: 1.3em;
            cursor: pointer;
            padding: 10px;
            border-radius: 50%;
            transition: all 0.3s ease;
            width: 45px;
            height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .nav-item:hover,
        .nav-item.active {
            background: rgba(255, 255, 255, 0.2);
            color: white;
        }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
            font-size: 1.1em;
        }
    </style>
</head>
<body>
    <div class="floating-shapes">
        <div class="shape"></div>
        <div class="shape"></div>
        <div class="shape"></div>
    </div>

    <div class="container">
        <div class="glass-card header">
            <h1>✨ 智能任务助手</h1>
            <p>让工作更高效，让生活更有序</p>
        </div>

        <div class="glass-card">
            <div class="search-bar">
                <span class="search-icon">🔍</span>
                <input type="text" class="search-input" placeholder="搜索任务、标签或备注...">
                <div class="avatar">U</div>
            </div>
            <div class="filter-tags">
                <span class="filter-tag active">全部</span>
                <span class="filter-tag">今天</span>
                <span class="filter-tag">本周</span>
                <span class="filter-tag">已完成</span>
                <span class="filter-tag">高优先级</span>
            </div>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon">📋</div>
                <div class="stat-value">24</div>
                <div class="stat-label">总任务数</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">⏳</div>
                <div class="stat-value">8</div>
                <div class="stat-label">进行中</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">✅</div>
                <div class="stat-value">16</div>
                <div class="stat-label">已完成</div>
                <div class="progress-bar">
                    <div class="progress-fill" style="width: 66.7%"></div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">🔥</div>
                <div class="stat-value">5</div>
                <div class="stat-label">连续完成天数</div>
            </div>
        </div>

        <div class="task-section">
            <div class="task-list">
                <h3 class="section-title">📌 今日待办</h3>
                <div class="task-item">
                    <div class="task-header">
                        <span class="task-title">完成项目报告</span>
                        <span class="task-priority priority-high">高</span>
                    </div>
                    <div class="task-meta">
                        <span>📅 今天 18:00</span>
                        <span>🏷️ 工作</span>
                    </div>
                </div>
                <div class="task-item">
                    <div class="task-header">
                        <span class="task-title">团队会议准备</span>
                        <span class="task-priority priority-medium">中</span>
                    </div>
                    <div class="task-meta">
                        <span>📅 今天 14:00</span>
                        <span>🏷️ 会议</span>
                    </div>
                </div>
                <div class="task-item">
                    <div class="task-header">
                        <span class="task-title">回复客户邮件</span>
                        <span class="task-priority priority-low">低</span>
                    </div>
                    <div class="task-meta">
                        <span>📅 今天 20:00</span>
                        <span>🏷️ 沟通</span>
                    </div>
                </div>
            </div>

            <div class="task-list">
                <h3 class="section-title">🎯 本周目标</h3>
                <div class="task-item">
                    <div class="task-header">
                        <span class="task-title">完成产品原型设计</span>
                        <span class="task-priority priority-high">高</span>
                    </div>
                    <div class="task-meta">
                        <span>📅 周五</span>
                        <span>🏷️ 设计</span>
                    </div>
                </div>
                <div class="task-item">
                    <div class="task-header">
                        <span class="task-title">学习新技术框架</span>
                        <span class="task-priority priority-medium">中</span>
                    </div>
                    <div class="task-meta">
                        <span>📅 周日</span>
                        <span>🏷️ 学习</span>
                    </div>
                </div>
                <div class="task-item">
                    <div class="task-header">
                        <span class="task-title">健身计划执行</span>
                        <span class="task-priority priority-low">低</span>
                    </div>
                    <div class="task-meta">
                        <span>📅 每天</span>
                        <span>🏷️ 健康</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="glass-card">
            <div class="quick-actions">
                <button class="action-btn primary">
                    <span>➕</span> 新建任务
                </button>
                <button class="action-btn">
                    <span>🎤</span> 语音输入
                </button>
                <button class="action-btn">
                    <span>🤖</span> AI助手
                </button>
                <button class="action-btn">
                    <span>📊</span> 统计报告
                </button>
            </div>
        </div>
    </div>

    <nav class="nav-bar">
        <button class="nav-item active">🏠</button>
        <button class="nav-item">📅</button>
        <button class="nav-item">➕</button>
        <button class="nav-item">📊</button>
        <button class="nav-item">⚙️</button>
    </nav>

    <script>
        document.querySelectorAll('.filter-tag').forEach(tag => {
            tag.addEventListener('click', function() {
                document.querySelectorAll('.filter-tag').forEach(t => t.classList.remove('active'));
                this.classList.add('active');
            });
        });

        document.querySelectorAll('.nav-item').forEach(item => {
            item.addEventListener('click', function() {
                document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
                this.classList.add('active');
            });
        });

        document.querySelectorAll('.task-item').forEach(item => {
            item.addEventListener('click', function() {
                this.style.opacity = '0.5';
                setTimeout(() => {
                    this.style.opacity = '1';
                }, 200);
            });
        });
    </script>
</body>
</html>
