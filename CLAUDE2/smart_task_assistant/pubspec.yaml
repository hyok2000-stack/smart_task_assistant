name: smart_task_assistant
description: "智能任务助手 - 基于AI的任务管理工具"
publish_to: 'none'
version: 2.2.30+204

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # 状态管理
  provider: ^6.1.1
  
  # 数据库
  sqflite: ^2.3.0
  path: ^1.8.3
  
  # UI组件
  cupertino_icons: ^1.0.6
  flutter_slidable: ^3.0.1
  shimmer: ^3.0.0
  fl_chart: 1.2.0
  
  # 网络请求
  dio: ^5.4.0
  
  # 本地存储
  shared_preferences: ^2.2.2
  flutter_secure_storage: 10.0.0
  path_provider: ^2.1.1
  universal_html: ^2.2.4
  package_info_plus: 10.0.0

  # 时间处理
  intl: ^0.20.2
  
  # 权限
  permission_handler: ^11.1.0
  
  # UUID
  uuid: ^4.2.1
  
  # 音频播放
  audioplayers: ^6.0.0
  
  # 振动
  vibration: 3.1.0

  # 语音合成（TTS）
  flutter_tts: ^4.0.0

  # 文件操作（移动端）
  file_picker: 13.0.0
  share_plus: 13.0.0

  # 拍照 + OCR 文本识别（离线，ML Kit on-device 不依赖 GMS，华为可用）
  image_picker: ^1.1.2
  google_mlkit_text_recognition: ^0.13.0

  # 天气服务（使用高德 IP 定位 API，不依赖 Google Play Services）
  http: ^1.2.0

  # 网络状态
  connectivity_plus: 7.0.0

  # 日历
  table_calendar: ^3.1.2
  speech_to_text: 7.0.0
  web: 1.1.1
  sherpa_onnx: ^1.13.8
  record: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  sqflite_common_ffi: ^2.4.0+3

flutter:
  uses-material-design: true
  
  assets:
    - assets/sounds/
    - assets/models/sherpa-zh14m/tokens.txt
    - assets/models/sherpa-zh14m/encoder-epoch-99-avg-1.int8.onnx
    - assets/models/sherpa-zh14m/decoder-epoch-99-avg-1.onnx
    - assets/models/sherpa-zh14m/joiner-epoch-99-avg-1.int8.onnx
