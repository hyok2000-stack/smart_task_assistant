name: smart_task_assistant
description: "智能任务助手 - 基于AI的任务管理工具"
publish_to: 'none'
version: 1.4.1+103

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # 状态管理
  provider: ^6.1.1
  
  # 数据库
  sqflite: ^2.3.0
  path: ^1.8.3
  
  # UI组件
  cupertino_icons: ^1.0.6
  flutter_slidable: ^3.0.1
  shimmer: ^3.0.0
  fl_chart: ^0.66.0
  
  # 网络请求
  dio: ^5.4.0
  
  # 本地存储
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.2.2
  path_provider: ^2.1.1
  universal_html: ^2.2.4
  package_info_plus: ^8.0.0
  
  # 通知
  flutter_local_notifications: ^17.0.0
  
  # 后台服务
  flutter_background_service: ^5.0.10
  
  # 时间处理
  intl: ^0.20.2
  
  # 权限
  permission_handler: ^11.1.0
  
  # UUID
  uuid: ^4.2.1
  
  # 音频播放
  audioplayers: ^6.0.0
  
  # 振动
  vibration: ^2.0.0

  # 语音合成（TTS）
  flutter_tts: ^4.0.0

  # 文件操作（移动端）
  file_picker: ^8.0.0
  share_plus: ^9.0.0
  open_filex: ^4.4.0
  
  # 位置服务
  geolocator: ^12.0.0
  geocoding: ^3.0.0
  
  # 天气服务
  http: ^1.2.0

  # 网络状态
  connectivity_plus: ^6.0.0

  # 日历
  table_calendar: ^3.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  
  assets:
    - assets/sounds/